# Gateway interno do SDR-AI (produção): um domínio, uma porta.
# O proxy da VPS termina o HTTPS e encaminha para cá.
server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # O proxy da VPS já manda https; repassa o que veio.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # API: painel (/api), webhooks da Evolution e do barber-shop (/webhook) e healthcheck.
    location ~ ^/(api|webhook|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }

    # Arquivos do build (nome com hash): podem ficar em cache.
    location ^~ /_next/static/ {
        proxy_pass http://frontend:3000;
    }

    # Painel Next.js.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Páginas sem cache em proxies: o OpenResty do painel da VPS tem cache ligado para todos os
        # sites e respeitava o s-maxage do Next.js, servindo a versão antiga por até 1 ano depois de
        # um deploy. Os arquivos de /_next/static têm hash no nome e seguem em cache (bloco acima).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
