# Gateway interno do SDR-AI (produção): um domínio, uma porta.
# O proxy da VPS termina o HTTPS e encaminha para cá.
server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # O proxy da VPS já manda https; repassa o que veio.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # API: painel (/api), webhooks da Evolution e do barber-shop (/webhook) e healthcheck.
    location ~ ^/(api|webhook|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }

    # Painel Next.js.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
